<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Scores"/>
<meta name="theme-color" content="#07090e"/>
<title>Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── Reset ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
color-scheme: dark;
--bg:        #07090e;
--surface:   #0d1018;
--card:      #111520;
--card-hi:   #161b28;
--border:    rgba(255,255,255,0.08);
--border-hi: rgba(255,255,255,0.14);
--text:      #eef0f6;
--text-dim:  #8a92a8;
--text-mute: #3d4460;
--live-red:  #ef4444;
--live-bg:   rgba(239,68,68,0.11);
--gold:      #f59e0b;
--green:     #22c55e;
--blue:      #3b82f6;
--safe-t: env(safe-area-inset-top,    0px);
--safe-b: env(safe-area-inset-bottom, 0px);
--safe-l: env(safe-area-inset-left,   0px);
--safe-r: env(safe-area-inset-right,  0px);
--sidebar-w: 220px;
--nav-h: 56px;
}

/* ── iOS web app shell ─────────────────────────────
html + body fill the full screen and don't scroll.
Only the content region inside scrolls.
──────────────────────────────────────────────────── */
html, body {
height: 100%;
width: 100%;
overflow: hidden;
background: var(--bg) !important;
color: var(--text) !important;
}

body {
font-family: 'Inter', system-ui, -apple-system, sans-serif;
-webkit-font-smoothing: antialiased;
-webkit-text-size-adjust: 100%;
/* Mobile: fixed flex column filling the whole screen */
display: flex;
flex-direction: column;
}

/* ── Animations ──────────────────────────────────── */
@keyframes blink   { 0%,100%{opacity:1;transform:scale(1);}  50%{opacity:.3;transform:scale(.6);} }
@keyframes spin    { to { transform:rotate(360deg); } }
@keyframes up      { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }
@keyframes shimmer { 0%,100%{opacity:1;} 50%{opacity:.4;} }

/* ═══════════════════════════════════════════════════
TOP CHROME — single bar: title + tabs + refresh
Hardcoded top padding large enough for any iPhone
(Dynamic Island ≈ 59px, regular notch ≈ 44px)
═══════════════════════════════════════════════════ */
.top-chrome {
flex-shrink: 0;
background: var(--bg);
border-bottom: 1px solid var(--border);
/* 60px hardcoded top padding clears Dynamic Island on every iPhone.
safe-area is added on top as a bonus where it works. */
padding-top: max(60px, calc(env(safe-area-inset-top) + 12px));
padding-left:  calc(env(safe-area-inset-left,  0px) + 14px);
padding-right: calc(env(safe-area-inset-right, 0px) + 14px);
padding-bottom: 8px;
z-index: 10;
}

/* Title row */
.chrome-title {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 10px;
}

.header-wordmark {
font-family: 'Oswald', sans-serif;
font-weight: 700;
font-size: 1.3rem;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(--text);
flex: 1;
}

.live-pill {
display: flex;
align-items: center;
gap: 5px;
padding: 4px 10px;
border-radius: 20px;
background: var(--live-bg);
border: 1px solid rgba(239,68,68,.28);
font-size: 0.68rem;
font-weight: 600;
letter-spacing: 0.07em;
color: var(--live-red);
text-transform: uppercase;
opacity: 0;
transition: opacity .3s;
}
.live-pill.show { opacity: 1; }
.live-pill-dot {
width: 6px; height: 6px; border-radius: 50%;
background: var(--live-red);
animation: blink 1.6s ease-in-out infinite;
}

.refresh-btn {
width: 34px; height: 34px; border-radius: 50%;
border: 1px solid var(--border);
background: var(--surface);
color: var(--text-dim);
cursor: pointer;
display: flex; align-items: center; justify-content: center;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
transition: background .15s, color .15s;
flex-shrink: 0;
}
.refresh-btn:hover  { background: var(--card-hi); color: var(--text); }
.refresh-btn:active { background: var(--card-hi); color: var(--blue); }
.refresh-btn svg { width: 15px; height: 15px; }
.refresh-btn.spin svg { animation: spin .7s linear infinite; }

/* Tabs row — sits inside top-chrome, no extra wrapper needed */
.status-bar {
display: flex;
gap: 6px;
overflow-x: auto;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
}
.status-bar::-webkit-scrollbar { display: none; }

.status-btn {
flex: 1;
min-width: 74px;
padding: 8px 10px;
border: 1px solid var(--border);
border-radius: 10px;
background: var(--surface);
color: var(--text-dim);
font-family: 'Oswald', sans-serif;
font-weight: 500;
font-size: 0.78rem;
letter-spacing: 0.06em;
text-transform: uppercase;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
transition: all .2s;
display: flex; align-items: center; justify-content: center;
gap: 6px;
}
.status-btn:hover  { background: var(--card); color: var(--text-dim); }
.status-btn.active { background: var(--card-hi); border-color: var(--border-hi); color: var(--text); }
.status-btn.live-status.active {
border-color: rgba(239,68,68,.35);
background: rgba(239,68,68,.08);
color: var(--live-red);
}

.scnt {
display: inline-flex; align-items: center; justify-content: center;
min-width: 17px; height: 17px;
border-radius: 9px; padding: 0 4px;
font-size: 0.64rem; font-weight: 700;
background: rgba(255,255,255,.08);
color: inherit;
}
.live-status .scnt.on { background: var(--live-red); color: #fff; }

/* ═══════════════════════════════════════════════════
SCROLL REGION — fills remaining height, scrolls
═══════════════════════════════════════════════════ */
.scroll-region {
flex: 1;
overflow-y: auto;
overflow-x: hidden;
-webkit-overflow-scrolling: touch;
/* Bottom padding so last card isn't hidden behind sport nav */
padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
}

/* ═══════════════════════════════════════════════════
MOBILE BOTTOM SPORT NAV — fixed chrome
═══════════════════════════════════════════════════ */
.sport-bar {
flex-shrink: 0;
display: flex;
height: calc(var(--nav-h) + var(--safe-b));
padding-bottom: var(--safe-b);
background: var(--bg);
border-top: 1px solid var(--border);
z-index: 10;
}

.sport-btn {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 3px;
padding: 8px 4px 6px;
border: none;
background: transparent;
color: var(--text-mute);
cursor: pointer;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
transition: color .2s;
font-family: 'Oswald', sans-serif;
font-size: 0.65rem;
font-weight: 600;
letter-spacing: 0.08em;
text-transform: uppercase;
position: relative;
}
.sport-btn.active { color: var(--text); }
.sport-btn:hover  { color: var(--text-dim); }

.sport-icon {
font-size: 1.35rem;
line-height: 1;
transition: transform .2s;
}
.sport-btn.active .sport-icon { transform: scale(1.12); }

.sport-btn::after {
content: '';
position: absolute;
top: 0; left: 22%; right: 22%;
height: 2px;
border-radius: 0 0 3px 3px;
background: var(--text);
transform: scaleX(0);
transition: transform .25s;
}
.sport-btn.active::after { transform: scaleX(1); }

.live-badge {
display: none;
position: absolute;
top: 5px; right: calc(50% - 20px);
width: 8px; height: 8px;
border-radius: 50%;
background: var(--live-red);
border: 2px solid var(--bg);
}
.live-badge.show { display: block; }

/* ═══════════════════════════════════════════════════
SPORT VIEWS & SECTIONS
═══════════════════════════════════════════════════ */
.sport-view { display: none; }
.sport-view.active { display: block; }

.sidebar { display: none; }

.status-section { display: none; padding: 10px 12px 0; }
.status-section.active { display: block; }

/* Card grid — single column on mobile */
.cards-grid {
display: grid;
grid-template-columns: 1fr;
gap: 0;
}

/* ── DESKTOP (≥ 768px) ──────────────────────────── */
@media (min-width: 768px) {

/* Reset mobile flex shell to normal document flow */
html, body { height: auto; overflow: auto; }
body { display: block; padding-bottom: 32px; }

/* Desktop grid layout */
body > .top-chrome {
padding-top: 14px;
padding-bottom: 10px;
padding-left: 28px;
padding-right: 28px;
position: sticky;
top: 0;
z-index: 60;
display: grid;
grid-template-columns: var(--sidebar-w) 1fr;
gap: 0;
}

/* On desktop, title row spans full width above the tab row */
.chrome-title {
grid-column: 1 / -1;
margin-bottom: 0;
padding-bottom: 10px;
}

/* Status bar sits in column 2 of the chrome grid */
.status-bar {
grid-column: 2;
padding: 0;
}

/* Scroll region: normal block, grid for sidebar + content */
.scroll-region {
overflow: visible;
padding-bottom: 0;
flex: none;
display: grid;
grid-template-columns: var(--sidebar-w) 1fr;
min-height: calc(100dvh - 120px);
}

/* Hide mobile bottom nav */
.sport-bar { display: none; }

/* Sidebar */
.sidebar {
display: flex;
flex-direction: column;
grid-column: 1;
border-right: 1px solid var(--border);
background: var(--surface);
padding: 20px 0;
position: sticky;
top: 120px;
height: calc(100dvh - 120px);
overflow-y: auto;
align-self: start;
}

.sidebar-btn {
display: flex; align-items: center; gap: 12px;
padding: 12px 20px; border: none; background: transparent;
color: var(--text-mute); cursor: pointer;
font-family: 'Oswald', sans-serif; font-size: 0.9rem;
font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
width: 100%; text-align: left;
transition: background .15s, color .15s; position: relative;
}
.sidebar-btn:hover  { background: rgba(255,255,255,.04); color: var(--text-dim); }
.sidebar-btn.active { background: rgba(255,255,255,.07); color: var(--text); }
.sidebar-btn::before {
content: ''; position: absolute;
left: 0; top: 20%; bottom: 20%;
width: 3px; border-radius: 0 3px 3px 0;
background: var(--text); transform: scaleY(0); transition: transform .2s;
}
.sidebar-btn.active::before { transform: scaleY(1); }
.sidebar-icon { font-size: 1.3rem; flex-shrink: 0; }
.sidebar-live-dot {
width: 7px; height: 7px; border-radius: 50%;
background: var(--live-red); margin-left: auto;
display: none; animation: blink 1.6s ease-in-out infinite;
}
.sidebar-live-dot.show { display: block; }

/* Sport views in column 2 */
.sport-view { grid-column: 2; display: none; }
.sport-view.active { display: block; }

.status-section { padding: 10px 24px 0; }

/* 2-column card grid */
.cards-grid {
grid-template-columns: repeat(2, 1fr);
gap: 10px; padding-bottom: 10px;
}
.cards-grid .game-card { margin-bottom: 0; }
}

/* 3-column on wide screens */
@media (min-width: 1200px) {
:root { --sidebar-w: 240px; }
.cards-grid { grid-template-columns: repeat(3, 1fr); }
}

/* ═══════════════════════════════════════════════════
GAME CARDS
═══════════════════════════════════════════════════ */
.game-card {
background: var(--card);
border: 1px solid var(--border);
border-radius: 16px;
overflow: hidden;
margin-bottom: 10px;
animation: up .28s ease both;
position: relative;
}
.game-card.live { border-color: rgba(239,68,68,.24); }
.live-bar { height: 2px; background: linear-gradient(90deg,var(--live-red),transparent 70%); }

.card-top {
display: flex; align-items: center; justify-content: space-between;
padding: 8px 14px;
border-bottom: 1px solid var(--border);
background: var(--surface);
}

.status-pill {
display: inline-flex; align-items: center; gap: 5px;
padding: 3px 9px; border-radius: 20px;
font-family: 'Oswald', sans-serif;
font-weight: 500; font-size: 0.7rem; letter-spacing: .08em; text-transform: uppercase;
}
.p-live    { background:var(--live-bg);           color:var(--live-red); }
.p-final   { background:rgba(100,110,130,.13);     color:var(--text-dim); }
.p-pre     { background:rgba(59,130,246,.11);      color:#60a5fa; }
.p-special { background:rgba(245,158,11,.12);      color:var(--gold); }
.p-dot { width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.6s ease-in-out infinite; }

.card-meta { font-size:.73rem; font-weight:500; color:var(--text-dim); text-align:right; max-width:55%; }

.card-body {
display: grid;
grid-template-columns: 1fr auto 1fr;
align-items: center;
padding: 16px 14px;
gap: 10px;
width: 100%;
}

.team-col { display:flex; flex-direction:column; align-items:center; gap:6px; }

.logo-wrap {
position:relative; width:58px; height:58px;
display:flex; align-items:center; justify-content:center;
}
.team-logo {
width:54px; height:54px; object-fit:contain;
filter:drop-shadow(0 2px 8px rgba(0,0,0,.65));
display:block;
}

.poss-pip {
position:absolute; bottom:-2px; right:-2px;
width:14px; height:14px; border-radius:50%;
background:var(--gold); border:2px solid var(--card);
display:flex; align-items:center; justify-content:center;
font-size:7px; line-height:1;
}

.bases { position:absolute; bottom:-4px; right:-4px; width:24px; height:24px; }
.bases svg { width:24px; height:24px; }

.team-abbr {
font-family:'Oswald',sans-serif; font-weight:700; font-size:1rem;
letter-spacing:.04em; text-transform:uppercase; line-height:1; color:var(--text);
}
.team-rank { font-size:.62em; color:var(--text-dim, #8a92a8); font-weight:500; margin-right:3px; vertical-align:top; }
.team-record { font-size:.68rem; color:var(--text-mute); font-weight:500; line-height:1; }

.timeouts { display:flex; gap:4px; }
.to-dot { width:6px;height:6px;border-radius:50%;background:var(--text-mute);border:1px solid var(--border-hi); }
.to-dot.on { background:var(--gold);border-color:var(--gold); }

.score-center { display:flex; flex-direction:column; align-items:center; gap:2px; }
.scores-row   { display:flex; align-items:center; gap:5px; }
.inn-arrow    { font-size:.65rem; color:var(--text-mute); margin-top:2px; }
.score-num {
font-family:'Oswald',sans-serif; font-weight:700; font-size:2.2rem;
line-height:1; color:var(--text); min-width:30px; text-align:center;
}
.score-num.win { color:var(--green); }
.score-num.dim { color:var(--text-mute); }
.score-sep { font-family:'Oswald',sans-serif; font-weight:300; font-size:1.4rem; color:var(--border-hi); line-height:1; }
.vs-lbl { font-family:'Oswald',sans-serif; font-weight:500; font-size:.85rem; color:var(--text-mute); letter-spacing:.06em; }

.card-footer {
display:flex; align-items:center; justify-content:center;
gap:6px; flex-wrap:wrap; padding:9px 14px 11px;
border-top:1px solid var(--border);
}

.chip {
display:inline-flex; align-items:center; gap:4px;
padding:4px 10px; border-radius:7px;
background:var(--surface); border:1px solid var(--border);
font-family:'Oswald',sans-serif; font-weight:500; font-size:.76rem;
letter-spacing:.04em; color:var(--text-dim);
}
.chip.hl    { background:rgba(245,158,11,.09);  border-color:rgba(245,158,11,.22); color:var(--gold); }
.chip.blue  { background:rgba(59,130,246,.09);  border-color:rgba(59,130,246,.2);  color:#60a5fa; }
.chip.green { background:rgba(34,197,94,.09);   border-color:rgba(34,197,94,.2);   color:var(--green); }

/* ── MLB Linescore ─────────────────────────────── */
.linescore-wrap {
padding:0 14px 12px; border-top:1px solid var(--border);
overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.linescore-wrap::-webkit-scrollbar { display:none; }
.linescore {
width:100%; border-collapse:collapse;
font-family:'Oswald',sans-serif; font-size:0.72rem; font-weight:500;
margin-top:10px; min-width:280px;
}
.linescore th { color:var(--text-mute);font-weight:600;text-align:center;padding:0 5px 4px;letter-spacing:.05em; }
.linescore th.label-col { text-align:left;padding-left:0;min-width:36px; }
.linescore td { text-align:center;padding:3px 5px;color:var(--text-dim);border-radius:4px; }
.linescore td.label-col { text-align:left;font-weight:700;color:var(--text);padding-left:0; }
.linescore td.stat-col  { font-weight:700;color:var(--text); }
.linescore td.cur-cell  { color:var(--text);font-weight:700; }

/* ── Empty / Skeleton ──────────────────────────── */
.empty-state { text-align:center;padding:48px 24px;color:var(--text-mute); }
.empty-state svg { width:42px;height:42px;margin:0 auto 12px;display:block;opacity:.2; }
.empty-state p { font-size:.875rem;font-weight:500; }

.skel-card {
background:var(--card); border:1px solid var(--border);
border-radius:16px; padding:16px; margin-bottom:10px;
animation:shimmer 1.5s ease infinite;
}
.sb { height:10px;border-radius:6px;background:rgba(255,255,255,.05);margin-bottom:10px; }
.sw60{width:60%;} .sw80{width:80%;} .sw40{width:40%;}
.sb-big { height:54px;width:100%;border-radius:10px;background:rgba(255,255,255,.05);margin:10px 0; }

/* ── Footer note ───────────────────────────────── */
.footer-note {
text-align:center; font-size:.68rem; color:var(--text-mute);
padding:10px 16px 0; letter-spacing:.02em;
}
@media (min-width: 768px) {
.footer-note { grid-column:2; padding-left:24px; text-align:left; }
}

/* ═══════════════════════════════════════════════════
TEAM DETAIL SHEET
═══════════════════════════════════════════════════ */
.team-col.tappable { cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:12px; transition:background .15s; }
.team-col.tappable:hover  { background:rgba(255,255,255,.04); }
.team-col.tappable:active { background:rgba(255,255,255,.07); }

.sheet-backdrop {
position:fixed; inset:0; z-index:100;
background:rgba(0,0,0,.55);
opacity:0; pointer-events:none; transition:opacity .22s;
}
.sheet-backdrop.open { opacity:1; pointer-events:auto; }

.team-sheet {
position:fixed; left:0; right:0; bottom:0; z-index:101;
max-height:85dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
background:#0d1018; color:#eef0f6;
border:1px solid rgba(255,255,255,.14); border-bottom:none;
border-radius:20px 20px 0 0;
padding:0 0 calc(20px + env(safe-area-inset-bottom, 0px));
transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.team-sheet.open { transform:translateY(0); }
@media (min-width: 768px) {
.team-sheet {
left:50%; right:auto; bottom:auto; top:50%; width:440px;
border-bottom:1px solid rgba(255,255,255,.14); border-radius:20px;
transform:translate(-50%,-46%); opacity:0; pointer-events:none;
transition:transform .22s, opacity .22s;
}
.team-sheet.open { transform:translate(-50%,-50%); opacity:1; pointer-events:auto; }
}

.ts-accent { height:4px; background:var(--team-color, #3b82f6); }
.ts-grip { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.18); margin:8px auto 0; }
@media (min-width: 768px) { .ts-grip { display:none; } }
.ts-close {
position:absolute; top:14px; right:14px; width:30px; height:30px;
border:none; border-radius:50%; background:rgba(255,255,255,.08); color:#8a92a8;
font-size:1.1rem; line-height:1; cursor:pointer;
}
.ts-head { display:flex; align-items:center; gap:14px; padding:14px 20px 16px; }
.ts-logo { width:64px; height:64px; object-fit:contain; flex-shrink:0; }
.ts-name { font-family:'Oswald',sans-serif; font-weight:700; font-size:1.35rem; letter-spacing:.02em; line-height:1.1; }
.ts-name .team-rank { font-size:.7em; }
.ts-sub { font-size:.8rem; color:#8a92a8; margin-top:4px; }

.ts-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:rgba(255,255,255,.08); border-block:1px solid rgba(255,255,255,.08); }
.ts-stat { background:#0d1018; padding:10px 8px; text-align:center; }
.ts-stat b { display:block; font-family:'Oswald',sans-serif; font-size:1.1rem; font-weight:600; }
.ts-stat span { font-size:.62rem; color:#8a92a8; text-transform:uppercase; letter-spacing:.08em; }

.ts-section { padding:16px 20px 0; }
.ts-section h3 { font-family:'Oswald',sans-serif; font-size:.72rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#8a92a8; margin-bottom:8px; }
.ts-game { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:.85rem; }
.ts-game:last-child { border-bottom:none; }
.ts-game img { width:24px; height:24px; object-fit:contain; }
.ts-game .opp { flex:1; }
.ts-game .when { color:#8a92a8; font-size:.75rem; }
.ts-res { font-family:'Oswald',sans-serif; font-weight:700; width:18px; text-align:center; }
.ts-res.w { color:#22c55e; } .ts-res.l { color:#ef4444; } .ts-res.t { color:#8a92a8; }
.ts-score { font-family:'Oswald',sans-serif; font-weight:500; }

<script>
/* ═══════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════ */
const APIS = {
  nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
  // groups=80 → all FBS games (default feed is Top 25 only)
  ncaa:'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300',
  mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
  nhl: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
};
const PREFIX = { nfl:'n', ncaa:'c', mlb:'m', nhl:'h' };
const TEAM_API = {
  nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams',
  ncaa:'https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams',
  mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/teams',
  nhl: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams',
};
const SCORE_UNIT = { nfl:'Pts', ncaa:'Pts', mlb:'Runs', nhl:'Goals' };



let activeSport = 'nfl';
let activeStatus = 'live';
let busy = false;
const cache = {}; // sport → parsed games

/* ═══════════════════════════════════════════════════
   SHARED HELPERS
═══════════════════════════════════════════════════ */
function pickLogo(logos) {
  if (!Array.isArray(logos)) return null;
  const byRel = r => logos.find(l => Array.isArray(l.rel) && l.rel.includes(r));
  return (byRel('scoreboard') || byRel('full') || logos[0])?.href || null;
}

// Build ESPN CDN logo URL directly from abbreviation as guaranteed fallback
function espnLogoUrl(sport, abbr) {
  if (!abbr) return '';
  const a = abbr.toLowerCase();
  const map = { nfl:'nfl', mlb:'mlb', nhl:'nhl' };
  return `https://a.espncdn.com/i/teamlogos/${map[sport]||sport}/500/scoreboard/${a}.png`;
}

function logoImg(abbr, apiUrl, sport) {
  const key = (abbr || '').toUpperCase();
  // Use API url first; fall back to direct ESPN CDN pattern
  const primary   = apiUrl || espnLogoUrl(sport, abbr);
  const secondary = espnLogoUrl(sport, abbr);
  if (!primary) return `<div style="width:54px;height:54px;"></div>`;
  const fallback = (primary !== secondary && secondary)
    ? `this.onerror=null;this.src='${secondary}';`
    : 'this.onerror=null;';
  return `<img class="team-logo" src="${primary}" alt="${key}" onerror="${fallback}"/>`;
}

function fmtTime(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
    + ' · ' + dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function skeletons(n=3) {
  return Array.from({length:n},()=>`
    <div class="skel-card">
      <div class="sb sw60"></div><div class="sb-big"></div>
      <div class="sb sw80"></div><div class="sb sw40"></div>
    </div>`).join('');
}
function emptyState(msg) {
  return `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9 10h.01M15 10h.01M9.5 15a3.5 3.5 0 005 0"/>
    </svg>
    <p>${msg}</p>
  </div>`;
}

/* ═══════════════════════════════════════════════════
   NFL + NCAA FOOTBALL
═══════════════════════════════════════════════════ */
function parseNFL(data, sport='nfl') {
  return (data?.events || []).map(ev => {
    const comp   = ev.competitions?.[0] || {};
    const status = comp.status || {};
    const stName = status.type?.name || '';
    const state  = (status.type?.state || 'pre').toLowerCase();
    const period = status.period || 0;
    const clock  = status.displayClock || '';
    const isHalf = stName === 'STATUS_HALFTIME';
    const sit    = comp.situation || {};
    let qStr = '';
    if (isHalf) qStr = 'Halftime';
    else if (state === 'in' && period) {
      const q = period <= 4 ? `Q${period}` : (period===5?'OT':`${period-4}OT`);
      qStr = clock ? `${q} · ${clock}` : q;
    }
    const teams = {};
    for (const c of comp.competitors || []) {
      const t = c.team || {};
      teams[c.homeAway] = {
        id: t.id||'', abbr: t.abbreviation||'',
        score: c.score != null ? Number(c.score) : null,
        record: c.records?.[0]?.summary || '',
        espnLogo: pickLogo(t.logos) || t.logo,
        timeouts: c.timeouts != null ? Number(c.timeouts) : null,
        rank: c.curatedRank?.current > 0 && c.curatedRank.current <= 25 ? c.curatedRank.current : null,
      };
    }
    const parseDnDist = txt => {
      if (!txt) return null;
      const m = txt.match(/(1st|2nd|3rd|4th)\s*&\s*(\d+|Goal)/i);
      return m ? `${m[1].toUpperCase()} & ${m[2]}` : txt;
    };
    return {
      sport, id:ev.id, date:ev.date, state, isHalf, stName, qStr,
      possId: sit.possession || null,
      dnDist: parseDnDist(sit.shortDownDistanceText),
      away: teams.away||{}, home: teams.home||{},
    };
  });
}

// College: ranked matchups first, best-ranked on top
function parseNCAA(data) {
  const best = g => Math.min(g.away.rank || 99, g.home.rank || 99);
  return parseNFL(data, 'ncaa').sort((a, b) => best(a) - best(b));
}

function buildNFLCard(g) {
  const {sport,away,home,state,isHalf,stName,qStr,possId,dnDist,date} = g;
  const abbr = t => `${t.rank?`<span class="team-rank">${t.rank}</span>`:''}${t.abbr||'–'}`;
  const isLive=state==='in'||isHalf, isPost=state==='post', isPre=state==='pre';
  const awW=isPost&&away.score>home.score, hwW=isPost&&home.score>away.score;
  const aP=!!(possId&&possId===away.id), hP=!!(possId&&possId===home.id);
  let pill=isHalf?`<span class="status-pill p-special">Halftime</span>`
    :isLive?`<span class="status-pill p-live"><span class="p-dot"></span>${qStr||'Live'}</span>`
    :isPost?`<span class="status-pill p-final">Final${stName.includes('OT')?' · OT':''}</span>`
    :`<span class="status-pill p-pre">Upcoming</span>`;
  let meta=isPre?`<span class="card-meta">${fmtTime(date)}</span>`
    :isPost?`<span class="card-meta">${fmtDate(date)}</span>`:'';
  let scoreArea=isPre?`<div class="vs-lbl">VS</div>`
    :`<div class="scores-row">
      <span class="score-num ${awW?'win':isPost?'dim':''}">${away.score??'–'}</span>
      <span class="score-sep">·</span>
      <span class="score-num ${hwW?'win':isPost?'dim':''}">${home.score??'–'}</span>
    </div>`;
  let footer='';
  if (isLive&&!isHalf&&(dnDist||qStr)) {
    footer=`<div class="card-footer">
      ${dnDist?`<span class="chip hl">🏈 ${dnDist}</span>`:''}
      ${qStr?`<span class="chip">${qStr}</span>`:''}
    </div>`;
  } else if (isHalf) {
    footer=`<div class="card-footer"><span class="chip hl">Halftime</span></div>`;
  }
  const toDots = n => `<div class="timeouts">${[0,1,2].map(i=>`<span class="to-dot${i<(Number(n)||0)?' on':''}"></span>`).join('')}</div>`;
  return `<div class="game-card${isLive?' live':''}">
    ${isLive?'<div class="live-bar"></div>':''}
    <div class="card-top">${pill}${meta}</div>
    <div class="card-body">
      <div class="team-col tappable" data-sport="${g.sport}" data-team="${away.id}">
        <div class="logo-wrap">${logoImg(away.abbr,away.espnLogo,sport)}${aP?'<div class="poss-pip">🏈</div>':''}</div>
        <span class="team-abbr">${abbr(away)}</span>
        <span class="team-record">${away.record||''}</span>
        ${isLive&&away.timeouts!=null?toDots(away.timeouts):''}
      </div>
      <div class="score-center">${scoreArea}</div>
      <div class="team-col tappable" data-sport="${g.sport}" data-team="${home.id}">
        <div class="logo-wrap">${logoImg(home.abbr,home.espnLogo,sport)}${hP?'<div class="poss-pip">🏈</div>':''}</div>
        <span class="team-abbr">${abbr(home)}</span>
        <span class="team-record">${home.record||''}</span>
        ${isLive&&home.timeouts!=null?toDots(home.timeouts):''}
      </div>
    </div>${footer}</div>`;
}

/* ═══════════════════════════════════════════════════
   MLB
═══════════════════════════════════════════════════ */
function parseMLB(data) {
  return (data?.events || []).map(ev => {
    const comp   = ev.competitions?.[0] || {};
    const status = comp.status || {};
    const stName = status.type?.name || '';
    const state  = (status.type?.state || 'pre').toLowerCase();
    const period = status.period || 0; // inning
    const sit    = comp.situation || {};
    const isDelayed = stName === 'STATUS_RAIN_DELAY' || stName === 'STATUS_DELAYED';
    const isSusp  = stName === 'STATUS_SUSPENDED';
    let innStr = '';
    if (state === 'in') {
      const half = sit.isTopInning ? 'Top' : 'Bot';
      innStr = period ? `${half} ${period}${ordSuffix(period)}` : 'In Progress';
    }
    const teams = {};
    for (const c of comp.competitors || []) {
      const t = c.team || {};
      const stats = {};
      for (const s of c.statistics||[]) stats[s.name] = s.displayValue;
      // Current pitcher: from situation for live games
      const pitcher = c.probables?.[0] || null;
      teams[c.homeAway] = {
        id:t.id||'', abbr:t.abbreviation||'',
        score: c.score != null ? Number(c.score) : null,
        record: c.records?.[0]?.summary || '',
        espnLogo: t.logo || pickLogo(t.logos),
        linescores: c.linescores || [],
        hits: stats.hits || '–',
        errors: stats.errors || '–',
        pitcher,
      };
    }
    // Live situation details
    const bases = { first:!!(sit.onFirst), second:!!(sit.onSecond), third:!!(sit.onThird) };
    // Current pitcher and batter from situation
    const activePitcher = sit.pitcher?.athlete || null;
    const activeBatter  = sit.batter?.athlete  || null;
    return {
      sport:'mlb', id:ev.id, date:ev.date, state, stName, isDelayed, isSusp,
      innStr, period, isTopInning: sit.isTopInning,
      outs: sit.outs, balls: sit.balls, strikes: sit.strikes,
      bases, activePitcher, activeBatter,
      away: teams.away||{}, home: teams.home||{},
    };
  });
}

function ordSuffix(n) {
  const s=['th','st','nd','rd'], v=n%100;
  return s[(v-20)%10]||s[v]||s[0];
}

function buildBaseDiamond(bases) {
  // simple SVG diamond with bases lit
  const fc = b => b ? '#f59e0b' : '#2a3050';
  const sc = b => b ? '#f59e0b' : '#1e2540';
  return `<svg viewBox="0 0 24 24" fill="none">
    <!-- second base (top) -->
    <rect x="9" y="2" width="6" height="6" rx="1" fill="${fc(bases.second)}" stroke="${sc(bases.second)}" stroke-width="1"/>
    <!-- third base (left) -->
    <rect x="2" y="9" width="6" height="6" rx="1" fill="${fc(bases.third)}" stroke="${sc(bases.third)}" stroke-width="1"/>
    <!-- first base (right) -->
    <rect x="16" y="9" width="6" height="6" rx="1" fill="${fc(bases.first)}" stroke="${sc(bases.first)}" stroke-width="1"/>
    <!-- home (bottom) -->
    <rect x="9" y="16" width="6" height="6" rx="1" fill="#1e2540" stroke="#2a3050" stroke-width="1"/>
  </svg>`;
}

function buildMLBCard(g) {
  const {away,home,state,stName,innStr,period,isTopInning,outs,balls,strikes,bases,
         activePitcher,activeBatter,date,isDelayed,isSusp} = g;
  const isLive=state==='in', isPost=state==='post', isPre=state==='pre';
  const awW=isPost&&away.score>home.score, hwW=isPost&&home.score>away.score;

  let pillTxt='', pillCls='p-pre';
  if (isDelayed)   { pillTxt='Delayed';    pillCls='p-special'; }
  else if (isSusp) { pillTxt='Suspended';  pillCls='p-special'; }
  else if (isLive) { pillTxt=innStr||'Live'; pillCls='p-live'; }
  else if (isPost) { pillTxt='Final';       pillCls='p-final'; }
  else             { pillTxt='Upcoming'; }

  const pill = isLive
    ? `<span class="status-pill ${pillCls}"><span class="p-dot"></span>${pillTxt}</span>`
    : `<span class="status-pill ${pillCls}">${pillTxt}</span>`;

  const meta = isPre  ? `<span class="card-meta">${fmtTime(date)}</span>`
             : isPost ? `<span class="card-meta">${fmtDate(date)}</span>` : '';

  const scoreArea = isPre
    ? `<div class="vs-lbl">VS</div>`
    : `<div class="scores-row">
        <span class="score-num ${awW?'win':isPost?'dim':''}">${away.score??'–'}</span>
        <span class="score-sep">·</span>
        <span class="score-num ${hwW?'win':isPost?'dim':''}">${home.score??'–'}</span>
      </div>`;

  // Inning arrow under score during live
  const innArrow = (isLive && period)
    ? `<span class="inn-arrow">${isTopInning?'▲':'▼'} ${period}${ordSuffix(period)}</span>` : '';

  // Footer chips
  const chips = [];
  if (isLive) {
    if (outs != null) chips.push(`<span class="chip">${outs} Out${outs===1?'':'s'}</span>`);
    if (balls != null && strikes != null) chips.push(`<span class="chip">${balls}–${strikes}</span>`);
    if (bases.first || bases.second || bases.third)
      chips.push(`<span class="chip hl" style="padding:4px 6px;">${buildBaseDiamond(bases)}</span>`);
    // Live pitcher and batter
    if (activePitcher?.shortName)
      chips.push(`<span class="chip blue">🤾 ${activePitcher.shortName}</span>`);
    if (activeBatter?.shortName)
      chips.push(`<span class="chip green">🏏 ${activeBatter.shortName}</span>`);
  }


  const footer = chips.length ? `<div class="card-footer">${chips.join('')}</div>` : '';

  // Linescore
  let linescore = '';
  if ((isLive || isPost) && (away.linescores?.length || home.linescores?.length)) {
    const maxInn = Math.max(away.linescores.length, home.linescores.length);
    const headers = Array.from({length:maxInn},(_,i)=>i+1);
    const aRow = headers.map(i => {
      const ls = away.linescores.find(l=>l.period===i);
      const cur = isLive && period===i;
      return `<td${cur?' class="cur-cell"':''}>${ls?.displayValue??''}</td>`;
    });
    const hRow = headers.map(i => {
      const ls = home.linescores.find(l=>l.period===i);
      const cur = isLive && period===i;
      return `<td${cur?' class="cur-cell"':''}>${ls?.displayValue??''}</td>`;
    });
    linescore = `<div class="linescore-wrap">
      <table class="linescore">
        <thead><tr>
          <th class="label-col"></th>
          ${headers.map(i=>`<th>${i}</th>`).join('')}
          <th>R</th><th>H</th><th>E</th>
        </tr></thead>
        <tbody>
          <tr><td class="label-col">${away.abbr}</td>${aRow.join('')}
            <td class="stat-col">${away.score??''}</td>
            <td class="stat-col">${away.hits}</td>
            <td class="stat-col">${away.errors}</td>
          </tr>
          <tr><td class="label-col">${home.abbr}</td>${hRow.join('')}
            <td class="stat-col">${home.score??''}</td>
            <td class="stat-col">${home.hits}</td>
            <td class="stat-col">${home.errors}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  return `<div class="game-card${isLive?' live':''}">
    ${isLive?'<div class="live-bar"></div>':''}
    <div class="card-top">${pill}${meta}</div>
    <div class="card-body">
      <div class="team-col tappable" data-sport="${g.sport}" data-team="${away.id}">
        <div class="logo-wrap">${logoImg(away.abbr,away.espnLogo,'mlb')}</div>
        <span class="team-abbr">${away.abbr||'–'}</span>
        <span class="team-record">${away.record||''}</span>
      </div>
      <div class="score-center">${scoreArea}${innArrow}</div>
      <div class="team-col tappable" data-sport="${g.sport}" data-team="${home.id}">
        <div class="logo-wrap">${logoImg(home.abbr,home.espnLogo,'mlb')}</div>
        <span class="team-abbr">${home.abbr||'–'}</span>
        <span class="team-record">${home.record||''}</span>
      </div>
    </div>
    ${footer}${linescore}
  </div>`;
}

/* ═══════════════════════════════════════════════════
   NHL
═══════════════════════════════════════════════════ */
function parseNHL(data) {
  return (data?.events || []).map(ev => {
    const comp   = ev.competitions?.[0] || {};
    const status = comp.status || {};
    const stName = status.type?.name || '';
    const state  = (status.type?.state || 'pre').toLowerCase();
    const period = status.period || 0;
    const clock  = status.displayClock || '';
    const sit    = comp.situation || {};
    const isOT   = stName.includes('OT') || period > 3;
    const isSO   = stName === 'STATUS_FINAL_PEN_SHOOTOUT' || stName === 'STATUS_PEN_SHOOTOUT';
    const isIntermission = stName === 'STATUS_INTERMISSION';

    let pStr = '';
    if (isIntermission) {
      pStr = `${periodLabel(period)} Intermission`;
    } else if (state === 'in') {
      pStr = clock ? `${periodLabel(period)} · ${clock}` : periodLabel(period);
    }

    function periodLabel(p) {
      if (p === 1) return '1st';
      if (p === 2) return '2nd';
      if (p === 3) return '3rd';
      if (p === 4) return isSO ? 'SO' : 'OT';
      return `${p-3}OT`;
    }

    const teams = {};
    for (const c of comp.competitors || []) {
      const t = c.team || {};
      const stats = {};
      for (const s of c.statistics||[]) stats[s.name] = s.displayValue;
      teams[c.homeAway] = {
        id:t.id||'', abbr:t.abbreviation||'',
        score: c.score != null ? Number(c.score) : null,
        record: c.records?.[0]?.summary || '',
        espnLogo: pickLogo(t.logos) || t.logo,
        shots: stats.shotsOnGoal || null,
        goalie: c.probables?.[0] || null,
      };
    }
    const isPP = !!(sit.isRedZone); // ESPN uses isRedZone for power play in some endpoints
    return {
      sport:'nhl', id:ev.id, date:ev.date, state, stName, pStr, period,
      isOT, isSO, isIntermission,
      away: teams.away||{}, home: teams.home||{},
    };
  });
}

function buildNHLCard(g) {
  const {away,home,state,stName,pStr,period,isOT,isSO,isIntermission,date} = g;
  const isLive=state==='in'||isIntermission, isPost=state==='post', isPre=state==='pre';
  const awW=isPost&&away.score>home.score, hwW=isPost&&home.score>away.score;

  let pillTxt, pillCls='p-pre';
  if (isIntermission) { pillTxt=pStr||'Intermission'; pillCls='p-special'; }
  else if (isLive)    { pillTxt=pStr||'Live'; pillCls='p-live'; }
  else if (isPost) {
    pillTxt = isSO ? 'Final · SO' : isOT ? 'Final · OT' : 'Final'; pillCls='p-final';
  } else { pillTxt='Upcoming'; }

  const pill = (isLive&&!isIntermission)
    ? `<span class="status-pill ${pillCls}"><span class="p-dot"></span>${pillTxt}</span>`
    : `<span class="status-pill ${pillCls}">${pillTxt}</span>`;

  let meta = isPre ? `<span class="card-meta">${fmtTime(date)}</span>`
    : isPost ? `<span class="card-meta">${fmtDate(date)}</span>` : '';

  let scoreArea = isPre
    ? `<div class="vs-lbl">VS</div>`
    : `<div class="scores-row">
        <span class="score-num ${awW?'win':isPost?'dim':''}">${away.score??'–'}</span>
        <span class="score-sep">·</span>
        <span class="score-num ${hwW?'win':isPost?'dim':''}">${home.score??'–'}</span>
      </div>`;

  let chips = [];
  if (isLive && pStr) chips.push(`<span class="chip">${pStr}</span>`);
  if (away.shots) chips.push(`<span class="chip">${away.abbr} ${away.shots} SOG</span>`);
  if (home.shots) chips.push(`<span class="chip">${home.abbr} ${home.shots} SOG</span>`);
  if (isPre) {
    if (away.goalie) chips.push(`<span class="chip blue">🥅 ${away.goalie.athlete?.shortName||''}</span>`);
    if (home.goalie) chips.push(`<span class="chip blue">🥅 ${home.goalie.athlete?.shortName||''}</span>`);
  }

  const footer = chips.length ? `<div class="card-footer">${chips.join('')}</div>` : '';

  return `<div class="game-card${isLive?' live':''}">
    ${isLive?'<div class="live-bar"></div>':''}
    <div class="card-top">${pill}${meta}</div>
    <div class="card-body">
      <div class="team-col tappable" data-sport="${g.sport}" data-team="${away.id}">
        <div class="logo-wrap">${logoImg(away.abbr,away.espnLogo,'nhl')}</div>
        <span class="team-abbr">${away.abbr||'–'}</span>
        <span class="team-record">${away.record||''}</span>
      </div>
      <div class="score-center">${scoreArea}</div>
      <div class="team-col tappable" data-sport="${g.sport}" data-team="${home.id}">
        <div class="logo-wrap">${logoImg(home.abbr,home.espnLogo,'nhl')}</div>
        <span class="team-abbr">${home.abbr||'–'}</span>
        <span class="team-record">${home.record||''}</span>
      </div>
    </div>
    ${footer}
  </div>`;
}

/* ═══════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════ */
function renderSport(sport, games) {
  const prefix = PREFIX[sport];
  const builder = { nfl:buildNFLCard, ncaa:buildNFLCard, mlb:buildMLBCard, nhl:buildNHLCard }[sport];

  const live  = games.filter(g => g.state === 'in' || g.isHalf || g.isIntermission);
  const pre   = games.filter(g => g.state === 'pre');
  const post  = games.filter(g => g.state === 'post');

  document.getElementById(`${prefix}g-live`).innerHTML = live.length
    ? live.map(builder).join('') : emptyState('No games in progress');
  document.getElementById(`${prefix}g-pre`).innerHTML  = pre.length
    ? pre.map(builder).join('')  : emptyState('No upcoming games today');
  document.getElementById(`${prefix}g-post`).innerHTML = post.length
    ? post.map(builder).join('') : emptyState('No completed games today');

  // Live badge — mobile bottom nav + desktop sidebar
  document.getElementById(`${sport}-badge`).classList.toggle('show', live.length > 0);
  const sdot = document.getElementById(`${sport}-sdot`);
  if (sdot) sdot.classList.toggle('show', live.length > 0);
}

function updateCounts() {
  const games = cache[activeSport] || [];
  const liveN = games.filter(g=>g.state==='in'||g.isHalf||g.isIntermission).length;
  const preN  = games.filter(g=>g.state==='pre').length;
  const postN = games.filter(g=>g.state==='post').length;

  const cL = document.getElementById('cntLive');
  const cP = document.getElementById('cntPre');
  const cPo= document.getElementById('cntPost');
  if (cL)  { cL.textContent  = liveN  || '–'; cL.classList.toggle('on', liveN > 0); }
  if (cP)  cP.textContent  = preN   || '–';
  if (cPo) cPo.textContent = postN  || '–';

  // Header live pill
  const anyLive = (cache[activeSport]||[]).some(g=>g.state==='in'||g.isHalf||g.isIntermission);
  document.getElementById('livePill').classList.toggle('show', anyLive);
}

/* ═══════════════════════════════════════════════════
   FETCH
═══════════════════════════════════════════════════ */
async function loadSport(sport, showSkel=false) {
  if (showSkel) {
    const prefix = PREFIX[sport];
    document.getElementById(`${prefix}g-live`).innerHTML = skeletons(2);
  }
  try {
    const res = await fetch(APIS[sport], { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const parsed = { nfl:parseNFL, ncaa:parseNCAA, mlb:parseMLB, nhl:parseNHL }[sport](data);
    cache[sport] = parsed;
    renderSport(sport, parsed);
  } catch (e) {
    console.error(sport, e);
  }
}

async function loadAll(showSkel=false) {
  if (busy) return;
  busy = true;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  if (showSkel) {
    const prefix = PREFIX[activeSport];
    document.getElementById(`${prefix}g-live`).innerHTML = skeletons(2);
  }
  await Promise.all(Object.keys(APIS).map(s => loadSport(s, false)));
  updateCounts();
  document.getElementById('footNote').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  btn.classList.remove('spin');
  busy = false;
}

/* ═══════════════════════════════════════════════════
   TEAM DETAIL SHEET
═══════════════════════════════════════════════════ */
const teamCache = {}; // `${sport}:${id}` → { at, data }
let sheetReq = 0;

async function fetchTeam(sport, id) {
  const key = `${sport}:${id}`;
  const hit = teamCache[key];
  if (hit && Date.now() - hit.at < 5 * 60_000) return hit.data;
  const get = url => fetch(url, { cache:'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const [info, sched] = await Promise.all([
    get(`${TEAM_API[sport]}/${id}`),
    get(`${TEAM_API[sport]}/${id}/schedule`).catch(() => ({})),
  ]);
  let events = sched.events || [];
  // In the postseason ESPN returns only playoff games — prepend the regular season
  if (sched.requestedSeason?.type === 3) {
    const reg = await get(`${TEAM_API[sport]}/${id}/schedule?seasontype=2`).catch(() => ({}));
    events = [...(reg.events || []), ...events];
  }
  const data = { team: info.team || {}, events };
  teamCache[key] = { at: Date.now(), data };
  return data;
}

function schedGame(ev, teamId) {
  const comp = ev.competitions?.[0] || {};
  const cs   = comp.competitors || [];
  const us   = cs.find(c => c.team?.id === teamId) || {};
  const opp  = cs.find(c => c.team?.id !== teamId) || {};
  const score = c => c.score?.displayValue ?? c.score ?? null;
  return {
    date: ev.date,
    state: comp.status?.type?.state || 'pre',
    home: us.homeAway === 'home',
    oppAbbr: opp.team?.abbreviation || '',
    oppName: opp.team?.shortDisplayName || opp.team?.displayName || '',
    oppLogo: pickLogo(opp.team?.logos) || opp.team?.logo || '',
    us: score(us), them: score(opp),
    result: us.winner ? 'w' : opp.winner ? 'l' : 't',
  };
}

function buildTeamSheet(sport, { team, events }) {
  const rec   = team.record?.items || [];
  const total = rec.find(r => r.type === 'total') || rec[0] || {};
  const stat  = n => total.stats?.find(s => s.name === n)?.value;
  const split = t => rec.find(r => r.type === t)?.summary;
  const streak = stat('streak');
  const avg = v => v != null && stat('gamesPlayed') ? v.toFixed(1) : '–';
  const unit = SCORE_UNIT[sport];

  const games = events.map(ev => schedGame(ev, team.id));
  // College records don't include home/away splits — derive from schedule
  const tally = home => {
    const done = games.filter(g => g.state === 'post' && g.home === home);
    if (!done.length) return null;
    const w = done.filter(g => g.result === 'w').length, l = done.filter(g => g.result === 'l').length;
    return `${w}-${l}`;
  };

  const stats = [
    ['Record', total.summary || '–'],
    ['Home',   split('home') || tally(true)  || '–'],
    ['Away',   split('road') || tally(false) || '–'],
    ['Streak', streak ? `${streak > 0 ? 'W' : 'L'}${Math.abs(streak)}` : '–'],
    [`${unit}/G`,     avg(stat('avgPointsFor'))],
    [`Opp ${unit}/G`, avg(stat('avgPointsAgainst'))],
  ];

  const recent = games.filter(g => g.state === 'post').slice(-5).reverse();
  const next   = games.find(g => g.state !== 'post');
  const oppLine = g => `<img src="${g.oppLogo}" alt="" onerror="this.style.visibility='hidden'"/>
    <span class="opp">${g.home ? 'vs' : '@'} ${g.oppName || g.oppAbbr}</span>`;

  const rank = team.rank > 0 && team.rank <= 25 ? `<span class="team-rank">${team.rank}</span>` : '';
  const link = team.links?.find(l => l.rel?.includes('clubhouse'))?.href;
  const color = /^[0-9a-f]{6}$/i.test(team.color || '') ? `#${team.color}` : '';

  return `
    <div class="ts-accent" style="${color ? `--team-color:${color}` : ''}"></div>
    <div class="ts-grip"></div>
    <button class="ts-close" id="teamSheetClose" aria-label="Close">✕</button>
    <div class="ts-head">
      <img class="ts-logo" src="${pickLogo(team.logos) || ''}" alt=""/>
      <div>
        <div class="ts-name">${rank}${team.displayName || team.abbreviation || ''}</div>
        <div class="ts-sub">${team.standingSummary || ''}</div>
      </div>
    </div>
    <div class="ts-stats">
      ${stats.map(([k, v]) => `<div class="ts-stat"><b>${v}</b><span>${k}</span></div>`).join('')}
    </div>
    ${next ? `<div class="ts-section"><h3>${next.state === 'in' ? 'Now Playing' : 'Next Game'}</h3>
      <div class="ts-game">${oppLine(next)}<span class="when">${fmtTime(next.date)}</span></div></div>` : ''}
    ${recent.length ? `<div class="ts-section"><h3>Last ${recent.length}</h3>
      ${recent.map(g => `<div class="ts-game">
        <span class="ts-res ${g.result}">${g.result.toUpperCase()}</span>${oppLine(g)}
        <span class="ts-score">${g.us}–${g.them}</span>
      </div>`).join('')}</div>` : ''}
    ${link ? `<a class="ts-link" href="${link}" target="_blank" rel="noopener">View on ESPN ↗</a>` : ''}`;
}

async function openTeamSheet(sport, id) {
  if (!TEAM_API[sport] || !id) return;
  const req = ++sheetReq;
  const body = document.getElementById('teamSheetBody');
  body.innerHTML = `<div class="ts-grip"></div><div class="ts-msg">Loading…</div>`;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('teamSheet').classList.add('open');
  try {
    const data = await fetchTeam(sport, id);
    if (req === sheetReq) body.innerHTML = buildTeamSheet(sport, data);
  } catch (e) {
    console.error('team', sport, id, e);
    if (req === sheetReq) body.innerHTML = `<div class="ts-grip"></div><div class="ts-msg">Couldn’t load team info.</div>`;
  }
}

function closeTeamSheet() {
  sheetReq++;
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('teamSheet').classList.remove('open');
}

// Delegated: cards are re-rendered on every refresh
document.addEventListener('click', e => {
  if (e.target.closest('#teamSheetClose')) return closeTeamSheet();
  const col = e.target.closest('.team-col.tappable');
  if (col) openTeamSheet(col.dataset.sport, col.dataset.team);
});
document.getElementById('sheetBackdrop').addEventListener('click', closeTeamSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTeamSheet(); });

/* ═══════════════════════════════════════════════════
   UI INTERACTIONS
═══════════════════════════════════════════════════ */
function switchSport(sport) {
  if (sport === activeSport) return;
  // Mobile bottom nav
  document.querySelectorAll('.sport-btn').forEach(b => b.classList.toggle('active', b.dataset.sport === sport));
  // Desktop sidebar
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.dataset.sport === sport));
  // Sport views
  document.querySelectorAll('.sport-view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${sport}`).classList.add('active');
  activeSport = sport;
  updateCounts();
  if (!cache[sport]) loadSport(sport, true).then(updateCounts);
}

// Mobile sport buttons
document.querySelectorAll('.sport-btn').forEach(btn => {
  btn.addEventListener('click', () => switchSport(btn.dataset.sport));
});

// Desktop sidebar buttons
document.querySelectorAll('.sidebar-btn').forEach(btn => {
  btn.addEventListener('click', () => switchSport(btn.dataset.sport));
});

// Status tabs — single shared bar
document.querySelectorAll('#statusBar .status-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const status = btn.dataset.status;
    document.querySelectorAll('#statusBar .status-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeStatus = status;
    Object.keys(APIS).forEach(sport => {
      document.querySelectorAll(`#view-${sport} .status-section`).forEach(s => s.classList.remove('active'));
      const el = document.getElementById(`${sport}-${status}`);
      if (el) el.classList.add('active');
    });
  });
});

// Refresh
document.getElementById('refreshBtn').addEventListener('click', () => loadAll(false));

/* ═══════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════ */
loadAll(true);
setInterval(() => loadAll(false), 30_000);
</script>
